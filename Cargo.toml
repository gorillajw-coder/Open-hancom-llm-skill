[workspace]
resolver = "3"
members = ["crates/oh-document", "crates/oh-host", "crates/oh-cli", "crates/oh-recipe", "crates/oh-library", "crates/oh-mcp"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"

# Local strict baseline completeness fix; see vendor/zune-jpeg/OPEN-HANCOM.md.
[patch.crates-io]
zune-jpeg = { path = "vendor/zune-jpeg" }

# 1.0 release build (D14): no extra obfuscation, symbols stripped. panic stays "unwind" because the
# MCP loop turns a handler panic into an error response (oh-mcp catch_unwind).
[profile.release]
lto = true
codegen-units = 1
strip = true
