# 공문 공통 틀 (D12, qa/learn-approval-summary.md). 결재표가 없는 대외 문서다.
# 구성: 발신 기관명 → 수신·(경유)·참조 → 제목 → 본문 항목(1. 2. …, 그 아래 가. 나. …) → 붙임 → "끝." → 명의 → 시행(문서번호·날짜)·주소·연락처.
# 번호(1. 가. 붙임 번호)와 "끝."은 코어가 붙인다(D4-3). LLM은 항목 문장만 한 줄에 하나씩 쓴다.
# 머리(수신·경유·참조·제목)는 라벨 셀 오른쪽 칸에 쓰고, 기관명·본문·명의·시행 칸은 기본 템플릿 좌표를 쓴다.
# 다른 공문 양식을 쓰는 카드는 같은 id의 [[cell]]을 다시 선언해 좌표를 바꾼다.
id = "official-letter"
title = "공문 공통 틀"
version = "1.0.0"

[[slot]]
id = "doc_date"
label = "시행 날짜(발송일)"
kind = "date"
required = true
require_source = true

[[slot]]
id = "doc_no"
label = "문서번호(문서관리 번호. 없으면 빈칸으로 두고 경고)"
kind = "text"
require_source = true

[[slot]]
id = "recipient"
label = "수신(기관명과 직위)"
kind = "prose"
required = true
guide = "받는 기관의 공식 명칭과 수신 직위(예: ○○공사 사장). 출처(계약서·이전 공문·사업 기록)에 있는 명칭만 쓰고, 없으면 묻는다(D11). 존칭·인사말은 넣지 않는다"
max_chars = 60
forbidden = ["귀하", "확인 필요"]

[[slot]]
id = "via"
label = "경유(선택)"
kind = "prose"
guide = "경유 기관이 있을 때만. 없으면 비운다"
max_chars = 60

[[slot]]
id = "cc"
label = "참조(선택, 부서·담당자)"
kind = "prose"
guide = "수신 기관 안의 참조 부서·담당자. 출처에 있을 때만"
max_chars = 60

[[slot]]
id = "doc_title"
label = "제목"
kind = "prose"
required = true
guide = "\"○○ 보고\", \"○○ 제출\", \"○○ 요청\"처럼 명사구로 끝낸다. 제목 끝말과 본문 마지막 문장의 서술(보고합니다/요청합니다)이 같아야 한다"
max_chars = 80
forbidden = ["의 건의 건"]

[[slot]]
id = "body"
label = "본문 항목(한 줄에 한 항목, 번호 없이. 코어가 1. 2. 를 붙인다)"
kind = "prose"
multiline = true
required = true
guide = "첫 항목은 관련 근거(\"관련: 계약서 제○조\" 등, 근거가 없으면 생략), 다음 항목에 요지와 요청·보고 문장. 세부 내용이 여럿이면 마지막 항목을 \"아래와 같이 …합니다.\"로 끝내고 세부는 items에 쓴다. 금액·날짜·수량은 출처 값 그대로 쓰고 계산하지 않는다(D4-2)"
max_chars = 400
forbidden = ["끝.", "확인 필요"]

[[slot]]
id = "items"
label = "세부 항목(선택, 한 줄에 하나, 번호 없이. 코어가 가. 나. 를 붙인다)"
kind = "prose"
multiline = true
guide = "본문 마지막 항목 아래 세부 사항. 한 줄은 \"일정: …\"처럼 머리말 + 내용으로 짧게"
max_chars = 600
forbidden = ["끝."]

[[slot]]
id = "attachments"
label = "붙임(선택, 한 줄에 하나, \"○○ 1부.\" 형식)"
kind = "prose"
multiline = true
guide = "실제로 같이 보내는 문서만. 이름 뒤에 부수(1부.)를 붙인다"
max_chars = 300
forbidden = ["끝."]

[[slot]]
id = "our_company"
label = "발신 기관(우리 회사명)"
kind = "text"
default_ref = "our_company"

[[slot]]
id = "sender_title"
label = "명의 직위(예: 대표이사)"
kind = "text"
default = "대표이사"

[[slot]]
id = "address"
label = "발신 주소(선택)"
kind = "text"
require_source = true

[[slot]]
id = "phone"
label = "전화(선택)"
kind = "phone"
require_source = true

[[slot]]
id = "email"
label = "이메일(선택)"
kind = "email"
require_source = true

[[slot]]
id = "author_name"
label = "담당자 성명(선택)"
kind = "person"
require_source = true

# ---- 머리 ----
[[cell]]
id = "sender_org"
table = 0
row = 0
col = 0
fmt = "{our_company}"

[[cell]]
id = "recipient"
label = "수신"
fmt = "{recipient}"

[[cell]]
id = "via"
label = "(경유)"
fmt = "[{via}]"

[[cell]]
id = "cc"
label = "참조"
fmt = "[{cc}]"

[[cell]]
id = "title"
label = "제목"
fmt = "{doc_title}"

# ---- 본문: 1. → 가. → 붙임 → 끝. (끝은 마지막 줄 뒤 두 칸) ----
[[cell]]
id = "body"
table = 0
row = 5
col = 0
fmt = "{body|num}[\n{items|ganada}][\n\n붙임  {attachments|attach}]  끝."

[[cell]]
id = "sender"
table = 0
row = 6
col = 0
fmt = "{our_company} {sender_title}"

[[cell]]
id = "footer"
table = 0
row = 7
col = 0
fmt = "시행  [{doc_no} ][({doc_date|date_dot}.)][\n{address}][\n전화 {phone}][\n이메일 {email}][\n담당 {author_name}]"

# ---- 룰 ----
[[rule]]
id = "doc-no-missing"
severity = "warn"
require = ["doc_no"]
message = "문서번호가 비어 있다. 문서관리 번호를 받으면 넣는다"

[project]
map = { our_company = "our_company", address = "our_address", phone = "our_phone" }
